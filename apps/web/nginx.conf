# Serves the built Kalpix website. Every unknown path falls back to index.html, because
# the app routes in the browser (React Router).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Built files carry a content hash in their names: cache them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The microphone is needed for "Speak your ad"; nothing else is allowed.
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(self)" always;
  }
}
